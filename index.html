<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMMORTAL - Email Verification</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0a0a0f;
            --surface: #111118;
            --surface2: #1a1a24;
            --border: #252535;
            --accent: #7c3aed;
            --accent2: #a855f7;
            --accent3: #06b6d4;
            --green: #10b981;
            --red: #ef4444;
            --yellow: #f59e0b;
            --text: #e2e8f0;
            --muted: #64748b;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'JetBrains Mono', monospace;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 50% at 20% -10%, rgba(124,58,237,0.12) 0%, transparent 60%),
                radial-gradient(ellipse 60% 40% at 80% 110%, rgba(6,182,212,0.08) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 500px;
            width: 90%;
            padding: 40px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 48px 40px;
            position: relative;
            box-shadow: 0 0 80px rgba(124,58,237,0.15), 0 32px 64px rgba(0,0,0,0.5);
            animation: slideUp 0.5s cubic-bezier(0.16,1,0.3,1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 20%;
            right: 20%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent2), transparent);
        }

        .logo {
            font-family: 'Syne', sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.3em;
            color: var(--accent2);
            text-transform: uppercase;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo::before {
            content: '';
            width: 6px;
            height: 6px;
            background: var(--accent2);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent2);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .title {
            font-family: 'Syne', sans-serif;
            font-size: 28px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 12px;
            line-height: 1.2;
        }

        .title span {
            color: var(--accent2);
        }

        .subtitle {
            color: var(--muted);
            font-size: 12px;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 24px;
        }

        .form-group label {
            font-size: 11px;
            color: var(--muted);
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        input[type="email"],
        input[type="text"] {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            padding: 12px 16px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(124,58,237,0.15);
        }

        button {
            width: 100%;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
            border: none;
            border-radius: 8px;
            color: white;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            font-weight: 600;
            padding: 12px 16px;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(124,58,237,0.4);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .message {
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 12px;
            margin-bottom: 16px;
            display: none;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.show {
            display: block;
        }

        .message.success {
            background: rgba(16,185,129,0.1);
            border: 1px solid rgba(16,185,129,0.3);
            color: var(--green);
        }

        .message.error {
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.3);
            color: var(--red);
        }

        .message.info {
            background: rgba(6,182,212,0.1);
            border: 1px solid rgba(6,182,212,0.3);
            color: var(--accent3);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 32px 0;
            color: var(--muted);
            font-size: 11px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .code-input-group {
            display: flex;
            gap: 8px;
        }

        .code-input-group input {
            flex: 1;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 8px;
            font-family: 'JetBrains Mono', monospace;
        }

        .resend-link {
            text-align: center;
            font-size: 11px;
            margin-top: 16px;
        }

        .resend-link a {
            color: var(--accent);
            text-decoration: none;
            cursor: pointer;
            transition: color 0.2s;
        }

        .resend-link a:hover {
            color: var(--accent2);
        }

        .timer {
            color: var(--yellow);
            font-size: 11px;
            text-align: center;
            margin-top: 8px;
            display: none;
        }

        .timer.show {
            display: block;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .footer-text {
            text-align: center;
            font-size: 11px;
            color: var(--muted);
            margin-top: 24px;
            line-height: 1.5;
        }

        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid rgba(124,58,237,0.3);
            border-radius: 50%;
            border-top-color: var(--accent);
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo">
                ◆ IMMORTAL
            </div>
            <h1 class="title">Email <span>Verification</span></h1>
            <p class="subtitle">Verify your email to proceed with registration</p>

            <div class="message" id="message"></div>

            <!-- Section 1: Email Input -->
            <div class="section active" id="emailSection">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="your@email.com" required>
                </div>
                <button onclick="sendVerificationEmail()" id="sendButton">Send Verification Code</button>
                <div class="footer-text">
                    We'll send you a 6-digit code to verify your email address
                </div>
            </div>

            <!-- Section 2: Code Verification -->
            <div class="section" id="codeSection">
                <div class="form-group">
                    <label>Verification Code</label>
                    <p class="subtitle" style="margin: 8px 0 16px 0;">Enter the 6-digit code sent to</p>
                    <p id="emailDisplay" style="color: var(--accent); font-weight: bold; margin-bottom: 16px;"></p>
                    <input type="text" id="verificationCode" placeholder="000000" maxlength="6" inputmode="numeric" required>
                </div>
                <button onclick="verifyCode()" id="verifyButton">Verify Code</button>
                
                <div class="resend-link">
                    <span>Didn't receive code?</span>
                    <a onclick="resendCode()"> Resend</a>
                </div>
                <div class="timer" id="resendTimer"></div>

                <button onclick="changeEmail()" style="background: transparent; border: 1px solid var(--border); color: var(--text); margin-top: 16px;">Change Email</button>
            </div>

            <!-- Section 3: Success -->
            <div class="section" id="successSection">
                <div style="text-align: center; padding: 20px 0;">
                    <div style="font-size: 48px; margin-bottom: 16px;">✓</div>
                    <h2 style="color: var(--green); margin-bottom: 8px;">Email Verified!</h2>
                    <p style="color: var(--muted); font-size: 12px; margin-bottom: 24px;">Your email has been successfully verified</p>
                </div>
                <button onclick="completeVerification()" style="background: linear-gradient(135deg, var(--green) 0%, #059669 100%);">Continue</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://immortal1234.pythonanywhere.com';
        let currentEmail = '';
        let resendTimer = 0;

        function showMessage(message, type = 'info') {
            const msgEl = document.getElementById('message');
            msgEl.textContent = message;
            msgEl.className = `message show ${type}`;
            msgEl.style.display = 'block';
        }

        function hideMessage() {
            const msgEl = document.getElementById('message');
            msgEl.className = 'message';
            msgEl.style.display = 'none';
        }

        async function sendVerificationEmail() {
            const email = document.getElementById('email').value.trim();
            
            if (!email) {
                showMessage('Please enter your email address', 'error');
                return;
            }

            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                showMessage('Please enter a valid email address', 'error');
                return;
            }

            const button = document.getElementById('sendButton');
            button.disabled = true;
            button.innerHTML = '<span class="spinner"></span>Sending...';

            try {
                const response = await fetch(`${API_URL}/send_verification_email`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `email=${encodeURIComponent(email)}`
                });

                const data = await response.json();

                if (response.ok) {
                    currentEmail = email;
                    showMessage(`Code sent to ${email}`, 'success');
                    
                    // Switch to code section
                    setTimeout(() => {
                        document.getElementById('emailSection').classList.remove('active');
                        document.getElementById('codeSection').classList.add('active');
                        document.getElementById('emailDisplay').textContent = email;
                        document.getElementById('verificationCode').focus();
                        hideMessage();
                        startResendTimer();
                    }, 500);
                } else {
                    showMessage(data.error || 'Failed to send verification code', 'error');
                }
            } catch (error) {
                showMessage('Connection error. Please try again.', 'error');
            } finally {
                button.disabled = false;
                button.innerHTML = 'Send Verification Code';
            }
        }

        async function verifyCode() {
            const code = document.getElementById('verificationCode').value.trim();

            if (!code || code.length !== 6) {
                showMessage('Please enter a valid 6-digit code', 'error');
                return;
            }

            const button = document.getElementById('verifyButton');
            button.disabled = true;
            button.innerHTML = '<span class="spinner"></span>Verifying...';

            try {
                const response = await fetch(`${API_URL}/verify_email_code`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `email=${encodeURIComponent(currentEmail)}&code=${encodeURIComponent(code)}`
                });

                const data = await response.json();

                if (response.ok && data.valid) {
                    showMessage('Email verified successfully!', 'success');
                    
                    setTimeout(() => {
                        document.getElementById('codeSection').classList.remove('active');
                        document.getElementById('successSection').classList.add('active');
                        hideMessage();
                    }, 500);
                } else {
                    showMessage(data.error || 'Invalid verification code', 'error');
                }
            } catch (error) {
                showMessage('Connection error. Please try again.', 'error');
            } finally {
                button.disabled = false;
                button.innerHTML = 'Verify Code';
            }
        }

        async function resendCode() {
            if (resendTimer > 0) return;

            try {
                const response = await fetch(`${API_URL}/resend_verification_email`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `email=${encodeURIComponent(currentEmail)}`
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage('New code sent to your email', 'success');
                    document.getElementById('verificationCode').value = '';
                    document.getElementById('verificationCode').focus();
                    startResendTimer();
                } else {
                    if (response.status === 429) {
                        showMessage(data.error, 'error');
                    } else {
                        showMessage(data.error || 'Failed to resend code', 'error');
                    }
                }
            } catch (error) {
                showMessage('Connection error. Please try again.', 'error');
            }
        }

        function startResendTimer() {
            resendTimer = 60;
            updateResendTimer();
        }

        function updateResendTimer() {
            const timerEl = document.getElementById('resendTimer');
            
            if (resendTimer > 0) {
                timerEl.classList.add('show');
                timerEl.textContent = `Resend code in ${resendTimer}s`;
                resendTimer--;
                setTimeout(updateResendTimer, 1000);
            } else {
                timerEl.classList.remove('show');
            }
        }

        function changeEmail() {
            currentEmail = '';
            resendTimer = 0;
            document.getElementById('codeSection').classList.remove('active');
            document.getElementById('emailSection').classList.add('active');
            document.getElementById('email').value = '';
            document.getElementById('verificationCode').value = '';
            document.getElementById('email').focus();
            hideMessage();
            document.getElementById('resendTimer').classList.remove('show');
        }

        function completeVerification() {
            // Here you can redirect or store the verified email
            alert(`Email ${currentEmail} verified successfully!\n\nYou can now proceed with your account.`);
            // Example: window.location.href = '/dashboard';
        }

        // Allow Enter key to send email
        document.getElementById('email').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendVerificationEmail();
        });

        // Allow Enter key to verify code
        document.getElementById('verificationCode').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') verifyCode();
        });

        // Only allow numbers in verification code
        document.getElementById('verificationCode').addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/[^0-9]/g, '');
        });
    </script>
</body>
</html>
